name: Docs

# The site is built from released versions only, so it changes when a release
# is tagged or when published docs are corrected on a release/<id> branch.
# Pushes to main deliberately do not publish: docs/public is the next release's
# documentation, previewed locally with `make docs`.
on:
  push:
    tags:
      - "v*"
    branches:
      - "release/*"
  workflow_dispatch:

# Only one deploy at a time; don't cancel a running one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1
        with:
          # Every published version is checked out from a tag or a release/<id>
          # branch during the build, and the git plugin renders per-page commit
          # history — none of which works from a shallow, single-ref clone.
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: make docs-build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
