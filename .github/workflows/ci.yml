name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Validate docs links
        run: make docs-validate

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: make build

  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: make format-check

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: make typecheck

  test:
    runs-on: ubuntu-latest

    # Email tests are opt-in via these vars (unset means skip — see
    # docs/dev/testing.md § Running tests), but CI must always run them: they
    # fail loudly here if the vars are missing, rather than silently skip.
    env:
      MAILPIT_API_URL: http://localhost:8025
      SMTP_URL: smtp://localhost:1025
      SMTP_FROM: Test <mailer-test@test.example>

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1

      # The mailer integration test sends real email to mailpit (see
      # docs/dev/testing.md § Running tests). Started from the compose file
      # rather than as a service container so the image pin has one home that
      # Dependabot can update.
      - name: Start mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait mailpit

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Test (with coverage thresholds)
        run: make test-coverage

# E2E tests live in ci-e2e.yml: they are path-filtered, and path filters apply
# to a whole workflow rather than a single job.
