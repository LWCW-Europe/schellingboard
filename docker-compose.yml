# Deployment file for self-hosting: copy this file and .env.docker.example into
# the same directory, then `cp .env.docker.example .env` (compose reads only a
# file literally named `.env`), fill it in and run `docker compose up -d`. See
# https://docs.schellingboard.org/self-hosting/deployment/
services:
  app:
    image: schellingboard/schellingboard:${SCHELLINGBOARD_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - data:/data
    environment:
      DATABASE_URL: file:/data/data.db
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SITE_URL: ${SITE_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REMINDER_DISPATCH_INTERVAL_MS: ${REMINDER_DISPATCH_INTERVAL_MS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  data:
