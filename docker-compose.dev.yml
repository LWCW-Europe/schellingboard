# Development-only services. Never part of a deployment — docker-compose.yml is
# the file self-hosters copy, and keeping this one separate means they don't have
# to wonder what mailpit is for.
#
# Start it with `make mailpit`, which points compose at `.env.dev.local`. Compose
# reads only a file literally named `.env` on its own, and that is where each
# clone keeps its own ports. See docs/dev/multiple-instances.md.
services:
  # Mailpit[1] receives email locally and shows it in a web UI. You need it to
  # send email from a development app, and for the email tests.
  #
  # MAILPIT_SMTP_PORT/MAILPIT_UI_PORT let you run several instances of this
  # project (separate clones or workspaces) on one machine without port clashes.
  #
  # [1]: https://mailpit.axllent.org/
  mailpit:
    # The only place the mailpit pin lives — CI starts mailpit from this file
    # rather than declaring a service container, because Dependabot can update a
    # compose file but not a workflow's `services:` image (dependabot-core#5819).
    # Tag *and* digest: the digest is the actual pin, the tag is what Dependabot
    # compares versions against (a digest on its own tells it nothing).
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    # CI sets neither variable and hardcodes these defaults in the MAILPIT_API_URL
    # and SMTP_URL of the ci, ci-e2e and release workflows — change a default
    # here and change them too.
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 15
